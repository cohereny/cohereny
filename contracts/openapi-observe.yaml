paths:
  /v1/audit-log:
    get:
      description: 'Newest first. Sorted by created_at DESC, with id as the tie-breaker.


        The tie-breaker matters: created_at has microsecond resolution but two

        entries written in one transaction can share a timestamp, and without a

        second sort key their relative order varies between calls — which makes

        offset paging skip or repeat rows.'
      operationId: list_audit_log_v1_audit_log_get
      parameters:
      - description: Entity reference, e.g. 'block:0f2c…'. Reviewer or above.
        in: query
        name: target
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Entity reference, e.g. 'block:0f2c…'. Reviewer or above.
          title: Target
      - description: Actions by one actor. Admin only.
        in: query
        name: actor_id
        required: false
        schema:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          description: Actions by one actor. Admin only.
          title: Actor Id
      - in: query
        name: limit
        required: false
        schema:
          default: 100
          maximum: 1000
          minimum: 1
          title: Limit
          type: integer
      - in: query
        name: offset
        required: false
        schema:
          default: 0
          maximum: 2147483647
          minimum: 0
          title: Offset
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AuditLogEntry'
                title: Response List Audit Log V1 Audit Log Get
                type: array
          description: Successful Response
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: The actor's role does not permit this.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: List Audit Log
      tags:
      - governance
