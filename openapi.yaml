        created_at:
          format: date-time
          title: Created At
          type: string
        created_by:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Created By
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        id:
          format: uuid
          title: Id
          type: string
        name:
          title: Name
          type: string
        nodes:
          default: []
          items:
            $ref: '#/components/schemas/WorkflowNode'
          title: Nodes
          type: array
        risk_classification:
          additionalProperties: true
          default: {}
          title: Risk Classification
          type: object
        scope_id:
          format: uuid
          title: Scope Id
          type: string
        status:
          enum:
          - draft
          - active
          - deprecated
          title: Status
          type: string
        superseded_by_version:
          anyOf:
          - type: integer
          - type: 'null'
          title: Superseded By Version
        version:
          title: Version
          type: integer
      required:
      - id
      - scope_id
      - name
      - version
      - status
      - created_at
      title: WorkflowDefinition
      type: object
    WorkflowListOut:
      properties:
        items:
          items:
            $ref: '#/components/schemas/WorkflowDefinition'
          title: Items
