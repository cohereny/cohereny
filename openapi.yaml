          $ref: '#/components/schemas/Role'
      required:
      - actor_id
      - role
      title: ScopeMemberCreate
      type: object
    ScopeNode:
      description: 'A node in the scope tree — represents an organizational or project level.


        scope_path is the full path from the root, stored as an ltree column in

        PostgreSQL (migration 009). Enables hierarchy queries without recursive

        CTEs: descendants via `scope_path <@ $1`, ancestors via `scope_path @> $1`.


        It is a dot-separated string, not a list -- that is what the driver returns

        for an ltree column, and splitting it here would mean joining it again for

        every query. Use .labels when the parts are needed.


        parent_id=None means root node (org level).'
      properties:
        created_at:
          format: date-time
          title: Created At
          type: string
        created_by:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Created By
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        id:
          format: uuid
          title: Id
          type: string
        name:
          title: Name
          type: string
        node_type:
          enum:
          - org
          - team
          - workspace
          - project
          - sub_project
          - personal
          title: Node Type
          type: string
        parent_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Parent Id
        privacy_level:
          anyOf:
          - enum:
            - public
            - internal
            - confidential
            - critical
            type: string
          - type: 'null'
          title: Privacy Level
        scope_path:
          title: Scope Path
          type: string
      required:
      - id
      - scope_path
      - node_type
      - name
      - created_at
      title: ScopeNode
      type: object
