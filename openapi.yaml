      - workflow_id
      - source_node_id
      - target_node_id
      title: WorkflowConnection
      type: object
    WorkflowCreate:
      properties:
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        name:
          minLength: 1
          title: Name
          type: string
        risk_classification:
          additionalProperties: true
          default: {}
          title: Risk Classification
          type: object
        scope_id:
          format: uuid
          title: Scope Id
          type: string
      required:
      - scope_id
      - name
      title: WorkflowCreate
      type: object
    WorkflowDefinition:
      description: 'Complete workflow definition including all nodes and edges.


        Versioned like ContextBlocks: changes produce new versions.

        Status lifecycle: draft → active → archived.

        scope_id: the scope determines which context is available for this workflow.'
      properties:
        connections:
          default: []
          items:
