    ScopeCreate:
      description: 'What a caller may say when creating a scope.


        Deliberately no `scope_path`. The ltree path is derived from `parent_id`

        plus the new node''s own id (ADR-008, CHY-59) — a client-supplied path can

        dismantle the hierarchy with a typo, and a wrong path does not fail loudly:

        the lookup simply returns nothing, which reads as "no context here".'
      properties:
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        name:
          title: Name
          type: string
        node_type:
          enum:
          - org
          - team
          - workspace
          - project
          - sub_project
          - personal
          title: Node Type
          type: string
        parent_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Parent Id
        privacy_level:
          anyOf:
          - enum:
            - public
            - internal
            - confidential
            - critical
            type: string
          - type: 'null'
          description: 'The class of data this scope holds. Omit it to inherit: the effective class is
            the strictest on the ancestor chain, and critical when nobody declared one. May not be looser
            than the parent''s effective class (CHY-160).'
          title: Privacy Level
      required:
      - name
      - node_type
      title: ScopeCreate
      type: object
    ScopeMemberCreate:
      description: 'Grant an actor a role inside one scope.


        The role vocabulary is the one from domain/roles.py, and the CHECK on

        scope_memberships.role lists the same five values (INFRA-92). Since CHY-92 a

        membership grants something: the runs of the scope''s workflows and of every

        scope below it become visible to the member (migration 035). The role

        inside the scope is recorded; what a person may *do* still follows their

        global role.'
      properties:
        actor_id:
          format: uuid
          title: Actor Id
          type: string
