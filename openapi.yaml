  /v1/workflows/runs/{run_id}/cancel:
    post:
      description: 'Stop a run that has not finished (EU AI Act Art. 14(4)(e)).


        For whoever started the run, and from `reviewer` up for whoever sees it.

        The run and the node it stopped at — the gate it waits at, or the node in

        flight — end as **`cancelled`**: neither a failure nor a rejection, and

        nothing is recorded as a decision at the gate. A node that is still working

        finishes, and its result is dropped.


        The reason is optional and stored with the run''s placeholders. Who stopped

        the run, and when, is audited as `workflow.run_cancelled` either way.'
      operationId: cancel_run_v1_workflows_runs__run_id__cancel_post
      parameters:
      - in: path
        name: run_id
        required: true
        schema:
          format: uuid
          title: Run Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/RunCancelRequest'
              - type: 'null'
              title: Body
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowRunOut'
          description: Successful Response
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: The actor's role does not permit this.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: The requested object does not exist.
        '409':
          description: The run is already over — complete, failed, rejected or cancelled. See CHY-200.
        '422':
          content:
            application/json:
              schema:
