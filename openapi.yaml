          title: Id
          type: string
        label:
          anyOf:
          - type: string
          - type: 'null'
          title: Label
        loop_limit:
          anyOf:
          - exclusiveMinimum: 0.0
            type: integer
          - type: 'null'
          description: Iterations allowed on this edge per run. Mandatory on a back edge, refused on activation
            if missing (ADR-026). Per edge, not per run — two independent loops must not limit one another.
          title: Loop Limit
        source_node_id:
          format: uuid
          title: Source Node Id
          type: string
        target_node_id:
          format: uuid
          title: Target Node Id
