      type: object
    WorkflowNode:
      description: "A node in the workflow graph with a type and configuration.\n\nnode_ref: human-readable\
        \ identifier within the workflow (e.g. \"summarize\").\nconfig:   type-specific parameters — for\
        \ llm_call e.g. model, temperature;\n          for context_compose e.g. scope_id, block_type_filter.\n\
        join_policy: only relevant for join_gateway nodes."
      properties:
        config:
          additionalProperties: true
          default: {}
          title: Config
          type: object
        context_requirements:
          anyOf:
          - $ref: '#/components/schemas/ContextRequirements'
          - type: 'null'
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        id:
          format: uuid
          title: Id
          type: string
        input_mapping:
          additionalProperties: true
          default: {}
          title: Input Mapping
          type: object
        join_policy:
          anyOf:
          - enum:
            - wait_all
            - wait_any
            - first_wins
            type: string
          - type: 'null'
          title: Join Policy
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        node_ref:
          title: Node Ref
          type: string
        node_type:
          enum:
          - context_compose
          - llm_call
          - tool_call
          - fork_gateway
          - join_gateway
          - human_review
          - sub_workflow
          title: Node Type
          type: string
        on_timeout:
          anyOf:
          - enum:
            - reject
            - escalate
            type: string
          - type: 'null'
          title: On Timeout
        output_mapping:
          additionalProperties: true
          default: {}
          title: Output Mapping
          type: object
        review_role:
          anyOf:
          - enum:
            - approver
            - four_eyes
            type: string
          - type: 'null'
          title: Review Role
        review_timeout:
          anyOf:
          - format: duration
            type: string
          - type: 'null'
          title: Review Timeout
        target_workflow_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Target Workflow Id
        target_workflow_version:
          anyOf:
          - type: integer
          - type: 'null'
          title: Target Workflow Version
        task_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Task Type
        workflow_id:
          format: uuid
          title: Workflow Id
          type: string
      required:
      - id
      - workflow_id
      - node_ref
      - node_type
      title: WorkflowNode
      type: object
    WorkflowRunOut:
      properties:
        actor_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Actor Id
        completed_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Completed At
        content_purged_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: When the retention purge cleared this run's input, result and node content (ADR-046).
            Null while the content is there; an empty input then means the input was empty.
          title: Content Purged At
        created_at:
          format: date-time
          title: Created At
          type: string
        error_message:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Message
        id:
          format: uuid
          title: Id
          type: string
        input_data:
          additionalProperties: true
          default: {}
          title: Input Data
          type: object
        parent_node_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Parent Node Id
        parent_run_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          description: Set when this run was started by a sub_workflow node. An independent run with its
            own audit trail, not a subgraph (ADR-028).
          title: Parent Run Id
        result:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Result
        started_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Started At
        status:
          enum:
          - pending
          - running
          - awaiting_oversight
          - complete
          - failed
          - rejected
          - cancelled
          title: Status
          type: string
        workflow_id:
          format: uuid
          title: Workflow Id
          type: string
        workflow_version:
          description: Which version actually ran. Pinned like a sub-workflow target — the question an
            audit asks.
          title: Workflow Version
          type: integer
      required:
      - id
      - workflow_id
      - workflow_version
      - status
      - created_at
      title: WorkflowRunOut
      type: object
    WorkflowRunStart:
      properties:
        input_data:
          additionalProperties: true
          default: {}
          description: 'The run''s input, reachable from every node as `run.<key>`. It is stored with
            placeholders: every text in it is replaced by the shipped patterns and the scope''s redaction
            rules before the run begins, and every step reads and writes placeholders (CHY-234). The key
            `identifiers_to_redact` names further values that identify someone, by category, e.g. {"PERSON":
            ["Erika Mustermann"]}. It is not stored with the input: its values go into the run''s encrypted
            mapping and are searched for in every step, found in the input or not.'
          title: Input Data
          type: object
      title: WorkflowRunStart
      type: object
    WorkflowStatusPut:
      properties:
        status:
          enum:
          - draft
          - active
          - deprecated
          title: Status
          type: string
      required:
      - status
      title: WorkflowStatusPut
      type: object
  securitySchemes:
    HTTPBearer:
      scheme: bearer
      type: http
info:
  description: "Self-hosted middleware for multi-LLM workflows with a versioned context\nrepository. Context\
    \ blocks live in a scope hierarchy (org → team → project),\nare composed along that hierarchy at request\
    \ time, and only reach a live prompt\nafter review.\n\nTwo conventions worth knowing before writing\
    \ a client:\n\n* **409 is normal.** The block lifecycle refuses transitions that are not\n  allowed\
    \ from the current status, and refuses a request whose `version` is not\n  the current one. That is\
    \ the review gate doing its job, not an error to retry.\n* **501 means planned.** Operations marked\
    \ `x-cohereny-status: planned` exist in\n  this contract and not yet in the code. Each names its ticket.\n\
    \nThis specification is generated from the running application and checked into\nthe repository as\
    \ `openapi.yaml`; CI fails when the two disagree (ADR-029).\n"
  title: Cohereny API
  version: 0.1.0
openapi: 3.1.0
paths:
  /v1/admin/actors/{actor_ref}/anonymize:
    post:
      description: 'GDPR Art. 17: sever an actor''s personal identity, keep the record.


        Idempotent — repeating it on an already anonymized actor succeeds and

        reports already_anonymized. A requester must not get an error for asking

        twice, and the second call is not a state change.'
      operationId: anonymize_actor_v1_admin_actors__actor_ref__anonymize_post
      parameters:
      - in: path
        name: actor_ref
        required: true
        schema:
          format: uuid
          title: Actor Ref
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnonymizeResult'
          description: Successful Response
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: The actor's role does not permit this.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: The requested object does not exist.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Anonymize Actor
      tags:
      - admin
  /v1/admin/retention:
    get:
      description: 'How long the installation keeps what (CHY-17, ADR-046).


        Every retention class with its tables, the columns that are content, and

        the periods that are set. With `scope_id`, also the period that applies in

        that scope and where it was declared. Readable from `reviewer` up: a

        supervisor needs to know the rule, not only whoever changes it.'
      operationId: get_retention_v1_admin_retention_get
      parameters:
      - in: query
        name: scope_id
        required: false
        schema:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Scope Id
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetentionOverview'
          description: Successful Response
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: The actor's role does not permit this.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: The requested object does not exist.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Get Retention
      tags:
      - admin
  /v1/admin/retention/{retention_class}:
    delete:
      description: 'Remove a scope''s own period, so the inherited one applies again. `admin`, audited.


        The installation-wide period can be changed, not removed.'
      operationId: remove_retention_override_v1_admin_retention__retention_class__delete
      parameters:
      - in: path
        name: retention_class
        required: true
        schema:
          enum:
          - run_content
          - run_trace
          title: Retention Class
          type: string
      - in: query
        name: scope_id
        required: true
        schema:
          format: uuid
          title: Scope Id
          type: string
      responses:
        '204':
          description: Successful Response
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: The actor's role does not permit this.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: The requested object does not exist.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Remove Retention Override
      tags:
      - admin
    put:
      description: 'Set a period, installation-wide (no `scope_id`) or for one scope. `admin`, audited.


        `keep_days: null` keeps without limit. Only `run_content` and `run_trace`

        take a period; the other classes say in GET why they do not.'
      operationId: set_retention_v1_admin_retention__retention_class__put
      parameters:
      - in: path
        name: retention_class
        required: true
        schema:
          enum:
          - run_content
          - run_trace
          title: Retention Class
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetentionPolicySet'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetentionPolicy'
          description: Successful Response
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: The actor's role does not permit this.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: The requested object does not exist.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnprocessableDetail'
          description: 'The request is invalid: a field failed validation (detail is a list), or a rule
            refused it (detail is a sentence) — for example a max_tokens above what the routing rule allows,
            or a routing rule that could never be used submitted for approval.'
      security:
      - HTTPBearer: []
      summary: Set Retention
      tags:
      - admin
  /v1/audit-log:
    get:
      description: 'Newest first. Sorted by created_at DESC, with id as the tie-breaker.


        The tie-breaker matters: created_at has microsecond resolution but two

        entries written in one transaction can share a timestamp, and without a

        second sort key their relative order varies between calls — which makes

        offset paging skip or repeat rows.'
      operationId: list_audit_log_v1_audit_log_get
      parameters:
      - description: Entity reference, e.g. 'block:0f2c…'. Reviewer or above.
        in: query
        name: target
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Entity reference, e.g. 'block:0f2c…'. Reviewer or above.
          title: Target
      - description: Actions by one actor. Admin only.
        in: query
        name: actor_id
        required: false
        schema:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          description: Actions by one actor. Admin only.
          title: Actor Id
      - in: query
        name: limit
        required: false
        schema:
          default: 100
          maximum: 1000
          minimum: 1
          title: Limit
          type: integer
      - in: query
        name: offset
        required: false
        schema:
          default: 0
          maximum: 2147483647
          minimum: 0
          title: Offset
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AuditLogEntry'
                title: Response List Audit Log V1 Audit Log Get
                type: array
          description: Successful Response
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: The actor's role does not permit this.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: List Audit Log
      tags:
      - governance
  /v1/benchmarks:
    get:
      description: Benchmark runs, newest first.
      operationId: list_runs_v1_benchmarks_get
      parameters:
      - in: query
        name: limit
        required: false
        schema:
          default: 50
          maximum: 200
          minimum: 1
          title: Limit
          type: integer
      - in: query
        name: offset
        required: false
        schema:
          default: 0
          maximum: 2147483647
          minimum: 0
          title: Offset
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BenchmarkRunList'
          description: Successful Response
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: The actor's role does not permit this.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: List Runs
      tags:
      - benchmarks
  /v1/benchmarks/run:
    post:
      operationId: trigger_run_v1_benchmarks_run_post
      responses:
        '501':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotImplementedDetail'
          description: Planned, not implemented. The body names the ticket.
      security:
      - HTTPBearer: []
      summary: Trigger Run
      tags:
      - benchmarks
      x-cohereny-status: planned
      x-cohereny-ticket: CHY-68
  /v1/benchmarks/{run_id}:
    get:
      description: 'One run and every measurement it took.


        A measurement without a score is an outage, not a result: its outcome

        says which (unreachable, refused by the data class, error) and `detail`

        why (migration 028).'
      operationId: get_run_v1_benchmarks__run_id__get
      parameters:
      - in: path
        name: run_id
        required: true
        schema:
          format: uuid
          title: Run Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BenchmarkRunDetail'
          description: Successful Response
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: The actor's role does not permit this.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: The requested object does not exist.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Get Run
      tags:
      - benchmarks
  /v1/benchmarks/{run_id}/approve:
    post:
      description: Human oversight approval after a detected regression.
      operationId: approve_report_v1_benchmarks__run_id__approve_post
      parameters:
      - in: path
        name: run_id
        required: true
