        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
        '501':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotImplementedDetail'
          description: Planned, not implemented. The body names the ticket.
      security:
      - HTTPBearer: []
      summary: Approve Report
      tags:
      - benchmarks
      x-cohereny-status: planned
      x-cohereny-ticket: CHY-64
  /v1/benchmarks/{run_id}/report:
    get:
      operationId: get_report_v1_benchmarks__run_id__report_get
      parameters:
      - in: path
        name: run_id
        required: true
        schema:
          title: Run Id
          type: string
      responses:
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
        '501':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotImplementedDetail'
          description: Planned, not implemented. The body names the ticket.
      security:
      - HTTPBearer: []
      summary: Get Report
      tags:
      - benchmarks
      x-cohereny-status: planned
      x-cohereny-ticket: CHY-64
  /v1/blocks:
    get:
      operationId: list_blocks_v1_blocks_get
      parameters:
      - in: query
        name: scope_id
        required: false
        schema:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Scope Id
      - in: query
        name: block_type
        required: false
        schema:
          anyOf:
          - enum:
            - system_prompt
            - user_context
            - tool_schema
            - example_io
            - calibration_anchor
            - routing_rule
            - redaction_rule
